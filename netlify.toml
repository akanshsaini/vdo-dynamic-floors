[build]
  publish = "public"
  command = "echo 'Static build — no build step needed'"

[[redirects]]
  from = "/api/*"
  to   = "https://YOUR-BACKEND-URL.railway.app/api/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
